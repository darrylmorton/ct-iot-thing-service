name: Build, Lint and Test

on:
  push:
    branches-ignore: [ "main" ]

env:
  NODEJS_VERSION: '22.x'

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: actions checkout
        uses: actions/checkout@v4

      - name: check-version
        uses: darrylmorton/ct-continuous-workflows/.github/actions/check-version@v1
        with:
          package-manager: 'npm'

  unit-tests:
    needs: [ check-version ]
    uses: darrylmorton/ct-continuous-workflows/.github/workflows/nodejs-test-unit.yml@v1
    with:
      nodejs-version: ${{ env.NODEJS_VERSION }}

  integration-tests:
    needs: [ check-version ]
    uses: darrylmorton/ct-continuous-workflows/.github/workflows/nodejs-test-integration.yml@v1
    with:
      nodejs-version: ${{ env.NODEJS_VERSION }}
      db-migrate-flag: 'true'
